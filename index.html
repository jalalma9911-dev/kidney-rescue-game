<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a2d"><link rel="manifest" href="manifest.webmanifest"><title>ماموریت نجات کلیه | زیست دهم</title><style>:root{--n:#061a2d;--c:#21d4ff;--g:#ffd45b;--ok:#27d47d}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:Tahoma,Arial;background:var(--n);color:#fff}.screen{display:none;position:absolute;inset:0}.on{display:block}.scene{height:100%;position:relative;overflow:hidden;background:#061a2d}.art{position:absolute;inset:0;background-repeat:no-repeat;background-size:400% 200%;background-position:0 0;filter:saturate(1.15);opacity:.9}.shade{position:absolute;inset:0;background:linear-gradient(#010a1240,#010a12bb)}.top{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.pill{background:#071d30dd;border:1px solid #70ecff88;border-radius:99px;padding:9px 13px;font-weight:900}.gold{color:#ffe78e}.center{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:16px}.card{width:min(820px,94vw);background:#051a2de8;border:1px solid #70ecff99;border-radius:30px;padding:28px;text-align:center;box-shadow:0 25px 70px #0008}.brand{color:#a7efff;font-weight:900}.h1{font-size:clamp(28px,5vw,54px);color:var(--g);font-weight:1000;margin:8px 0}.lead{font-size:clamp(16px,2.2vw,21px);line-height:2}.btn{background:linear-gradient(#ffe36e,#f4a318);color:#07385b;border:0;border-radius:16px;padding:14px 28px;font-weight:1000;font-size:19px;box-shadow:0 6px #995900;cursor:pointer}.form{display:grid;gap:12px;max-width:500px;margin:20px auto}.field{width:100%;padding:15px;border-radius:15px;border:2px solid #74ddf7;font-size:18px}.study{position:absolute;z-index:6;bottom:20px;left:50%;transform:translateX(-50%);width:min(720px,94vw);background:#051a2de8;border:1px solid #70ecff99;border-radius:20px;padding:13px;display:flex;gap:12px;align-items:center}.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#21d4ff;flex:none}.ring b{background:#09233a;border-radius:50%;width:44px;height:44px;display:grid;place-items:center}.copy{flex:1}.track{height:7px;background:#ffffff1d;border-radius:9px;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,var(--c),var(--g));border-radius:9px}.qwrap{position:absolute;z-index:8;inset:0;background:#010c16bb;display:grid;place-items:center;padding:14px}.qcard{width:min(920px,96vw);max-height:94vh;overflow:auto;background:#fff8e9;color:#17364d;border:4px solid #17c9ef;border-radius:28px;padding:24px}.qhead{display:flex;justify-content:space-between}.qtitle{font-weight:1000;color:#075a87;font-size:21px}.meta{background:#e4f6fb;border-radius:99px;padding:7px;font-weight:900}.qtext{text-align:center;font-size:clamp(18px,2.5vw,26px);font-weight:900;line-height:1.8;margin:18px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:#fff;color:#17445d;border:2px solid #b5ced8;border-radius:15px;padding:14px;text-align:right;font-weight:900;min-height:60px;cursor:pointer}.correct{background:#dffbe9!important;border-color:#22b86b!important}.wrong{background:#ffe5e4!important;border-color:#f15b60!important}.fb{display:none;margin-top:12px;padding:12px;border-radius:12px;text-align:center;font-weight:900}.ok{background:#d9ffe7;color:#075a35}.no{background:#ffe8e6;color:#8b2019}.next{display:none;margin:14px auto 0}.score{font-size:70px;color:var(--g);font-weight:1000}.rank{font-size:20px;color:#b8efff;font-weight:900}@media(max-width:700px){.choices{grid-template-columns:1fr}.card{padding:22px 15px}}</style><body><section class="screen on" id="welcome"><div class="scene"><div class="art" id="a0"></div><div class="shade"></div><div class="top"><span class="pill">🧬 ماموریت نجات کلیه</span><span class="pill gold">زیست دهم</span></div><div class="center"><div class="card"><div class="brand">زیست‌شناسی پایه دهم • مدرسه کوثر</div><div class="h1">ماموریت نجات کلیه</div><p class="lead">سفری در مسیر گردش خون کلیوی؛ گلومرول، نفرون و بازجذب را کشف کن.</p><button class="btn" id="start">🚀 شروع مأموریت</button><p>۵ مرحله آموزشی + ۵ سؤال جمع‌بندی</p></div></div></div></section><section class="screen" id="profile"><div class="scene"><div class="art" id="a1"></div><div class="shade"></div><div class="center"><div class="card"><div class="brand">آماده‌ای، پژوهشگر کوچک؟</div><div class="h1">مشخصات بازیکن</div><div class="form"><input class="field" id="name" placeholder="نام"><input class="field" id="family" placeholder="شهرت / نام خانوادگی"><button class="btn" id="enter">✨ ورود به مأموریت</button></div></div></div></div></section><section class="screen" id="study"><div class="scene"><div class="art" id="art"></div><div class="shade"></div><div class="top"><span class="pill" id="stage"></span><span class="pill gold" id="score"></span></div><div class="study"><div class="ring"><b id="num">۵</b></div><div class="copy"><strong id="stitle"></strong><small>با دقت تصویر و مسیر خون را مرور کن.</small><div class="track"><div class="fill" id="fill"></div></div></div></div></div></section><section class="screen" id="question"><div class="scene"><div class="art" id="qart"></div><div class="qwrap"><div class="qcard"><div class="qhead"><div class="qtitle" id="qt"></div><div class="meta" id="qm"></div></div><div class="qtext" id="qq"></div><div class="choices" id="choices"></div><div class="fb" id="fb"></div><button class="btn next" id="next">ادامه ▶</button></div></div></div></section><section class="screen" id="final"><div class="scene"><div class="art" id="af"></div><div class="shade"></div><div class="center"><div class="card"><div class="brand">گزارش نهایی مأموریت</div><div class="h1">🎉 مأموریت تمام شد!</div><div class="score" id="fs"></div><div class="rank" id="rank"></div><p class="lead" id="summary"></p><button class="btn" id="again">🔁 بازی دوباره</button></div></div></div></section><script>const S=[['ورود به کلیه','خون برای رسیدن به گلومرول ابتدا از کدام رگ عبور می‌کند؟',['سرخرگ آوران','سیاهرگ کلیوی','سرخرگ وابران','ورید اجوف تحتانی'],0],['گلومرول، ایستگاه پالایش','کدام ماده می‌تواند از سد تراوشی گلومرول عبور کند؟',['گلبول قرمز','پروتئین‌های بزرگ پلاسما','گلوکز','پلاکت خون'],2],['بازگشت به خون','خون پس از عبور از شبکه‌های مویرگی کلیه در نهایت وارد کدام رگ می‌شود؟',['سرخرگ کلیوی','سیاهرگ کلیوی','سرخرگک آوران','سرخرگک وابران'],1],['بازجذب در نفرون','کدام ماده مفید دوباره به خون بازجذب می‌شود؟',['گلوکز','گلبول قرمز','پروتئین‌های بزرگ','پلاکت'],0],['پس از عبور از کلیه','پس از خروج خون از کلیه، خون مستقیماً وارد کدام رگ می‌شود؟',['سرخرگ کلیوی','سیاهرگ کلیوی','سرخرگک آوران','سرخرگک وابران'],1]];const F=[['خون پس از خروج از کلیه وارد کدام رگ می‌شود؟',['سرخرگ کلیوی','سیاهرگ کلیوی','سرخرگک آوران','سرخرگک وابران'],1],['اولین مرحله تشکیل ادرار در نفرون کدام است؟',['بازجذب','ترشح','تراوش اولیه','دفع ادرار'],2],['کدام بخش محل اصلی تراوش اولیه خون است؟',['مثانه','گلومرول','سیاهرگ کلیوی','قلب'],1],['کدام دو فرایند در نفرون به تنظیم مایعات بدن کمک می‌کنند؟',['تراوش و بازجذب','گردش خون و تنفس','هضم و جذب','انقباض و انبساط'],0],['مسیر درست خون در گردش خون کلیوی کدام است؟',['قلب ← سرخرگ کلیوی ← کلیه ← سیاهرگ کلیوی ← قلب','قلب ← سیاهرگ کلیوی ← کلیه ← سرخرگ کلیوی ← قلب','کلیه ← قلب ← سرخرگ کلیوی','قلب ← نفرون ← کلیه'],0]];let img='',si=0,qi=0,sc=0,timer,player='دانش‌آموز';const $=x=>document.getElementById(x),fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}function setArt(el,n){if(!img)return;el.style.backgroundImage=`url(${img})`;el.style.backgroundPosition=`${(n%4)*33.333333}% ${Math.floor(n/4)*100}%`}async function loadImage(){try{let t=await fetch('assets/sprite-ultra.b64.txt').then(r=>r.text()),b=atob(t.trim()),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);img=URL.createObjectURL(new Blob([a],{type:'image/jpeg'}));setArt($('a0'),0);setArt($('a1'),1);setArt($('af'),7)}catch(e){console.warn('image load failed')}}function hud(){$('score').textContent='امتیاز: '+fa(sc)}function study(){let s=S[si];setArt($('art'),si);$('stage').textContent='مرحله '+fa(si+1);$('stitle').textContent=s[0];$('fill').style.width=((si+1)*20)+'%';let n=5;$('num').textContent=fa(n);hud();show('study');clearInterval(timer);timer=setInterval(()=>{n--;$('num').textContent=fa(Math.max(0,n));if(n<=0){clearInterval(timer);question(false)}},1000)}function question(fin){let q=fin?F[qi]:S[si],opts=fin?q[1]:q[2],ans=fin?q[2]:q[3];setArt($('qart'),fin?6:si);$('qt').textContent=fin?'سؤال جمع‌بندی '+fa(qi+1):q[0];$('qm').textContent=fin?fa(qi+1)+' از ۵':fa(si+1)+' از ۵';$('qq').textContent=q[0]||q[1];$('fb').style.display='none';$('next').style.display='none';$('choices').innerHTML=opts.map((x,i)=>`<button class="choice" data-i="${i}">${x}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i,ans,fin));show('question')}function answer(i,ans,fin){let bs=[...document.querySelectorAll('.choice')];bs.forEach(x=>x.disabled=true);bs[ans].classList.add('correct');if(i===ans){sc++;$('fb').className='fb ok';$('fb').textContent='🎉 آفرین! پاسخ درست است.'}else{bs[i].classList.add('wrong');$('fb').className='fb no';$('fb').textContent='پاسخ درست مشخص شد؛ مرور کن.'}$('fb').style.display='block';hud();$('next').style.display='block';$('next').onclick=()=>{if(fin){qi++;qi<5?question(true):finish()}else{si++;si<5?study():(qi=0,finalStudy())}}}function finalStudy(){let n=7;setArt($('art'),5);$('stage').textContent='جمع‌بندی';$('stitle').textContent='مرور نهایی مسیر خون';$('fill').style.width='100%';$('num').textContent=fa(n);show('study');clearInterval(timer);timer=setInterval(()=>{n--;$('num').textContent=fa(Math.max(0,n));if(n<=0){clearInterval(timer);question(true)}},1000)}function finish(){$('fs').textContent=fa(sc)+' / ۱۰';$('rank').textContent=sc>=9?'🏆 قهرمان گردش خون کلیوی!':sc>=7?'🌟 پژوهشگر ممتاز کلیه':sc>=5?'👏 پژوهشگر موفق':'💡 یک مرور دیگر و دوباره تلاش کن!';$('summary').textContent=player+'، مسیر ورود خون به کلیه، تراوش گلومرولی، بازجذب و بازگشت خون را دنبال کردی.';show('final')}$('start').onclick=()=>show('profile');$('enter').onclick=()=>{player=(($('name').value+' '+$('family').value).trim()||'دانش‌آموز');si=0;qi=0;sc=0;study()};$('again').onclick=()=>show('welcome');loadImage();</script></body></html>
