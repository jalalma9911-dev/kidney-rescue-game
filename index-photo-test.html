<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ماموریت نجات کلیه</title><style>body{margin:0;background:#061a2d;color:#fff;font-family:Tahoma,Arial}.wrap{max-width:900px;margin:auto;padding:18px}.hero{min-height:48vh;display:grid;place-items:center;border-radius:28px;background:linear-gradient(#061a2d99,#061a2ddd),url('assets/sprite-ultra.b64.txt') center/cover}.card{background:#061a2de8;border:1px solid #62ddff88;border-radius:24px;padding:25px;text-align:center}.h{font-size:clamp(28px,6vw,52px);color:#ffd45b;font-weight:900}.btn{border:0;border-radius:14px;padding:13px 22px;font-size:18px;font-weight:900;background:#ffd45b;color:#09233a}#photo{display:none}</style><div class="wrap"><div class="hero"><div class="card"><div>زیست‌شناسی پایه دهم • مدرسه کوثر</div><div class="h">ماموریت نجات کلیه</div><p>سفری در مسیر گردش خون کلیوی</p><button class="btn" onclick="start()">🚀 شروع مأموریت</button></div></div><p id="msg"></p><img id="photo"></div><script>async function start(){const t=await fetch('assets/sprite-ultra.b64.txt').then(r=>r.text());try{const bin=atob(t.trim()),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);const u=URL.createObjectURL(new Blob([a],{type:'image/jpeg'}));document.querySelector('.hero').style.backgroundImage=`linear-gradient(#061a2d66,#061a2ddd),url(${u})`;document.querySelector('#msg').textContent='تصاویر آموزشی بارگذاری شد ✓';}catch(e){document.querySelector('#msg').textContent='تصویر نیاز به بارگذاری مجدد دارد.'}}</script></html>
